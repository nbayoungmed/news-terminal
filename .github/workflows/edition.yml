name: Morning edition

on:
  schedule:
    # GitHub often starts scheduled runs hours late (or drops them), so try
    # three times at off-peak minutes. Later runs skip once today's edition
    # exists, so only one run a day calls the API.
    - cron: "17 4 * * *"
    - cron: "13 5 * * *"
    - cron: "11 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Scheduled runs skip if today's (London date) edition is already built;
      # manual runs always rebuild.
      - name: Check for today's edition
        id: check
        run: |
          f="docs/editions/$(TZ=Europe/London date +%F).json"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$f" ]; then
            echo "$f already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - name: Build edition
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional repo variable to switch model, e.g. claude-sonnet-5-5
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node scripts/build-edition.mjs

      - name: Commit edition
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "news-terminal-bot"
          git config user.email "news-terminal-bot@users.noreply.github.com"
          git add docs/editions data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Edition $(TZ=Europe/London date +%F)"
            git push
          fi
