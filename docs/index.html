<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>News Terminal</title>
  <meta name="theme-color" content="#0b0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Terminal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M15 20 L29 32 L15 44"/><rect x="33" y="40" width="17" height="6"/></svg></span><span class="brand-name">NEWS<span>TERM</span></span></div>
      <div class="edition">
        <button id="prev" class="nav" title="Previous edition (←)" aria-label="Previous edition">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="edition-meta">
          <div id="date-label">Loading…</div>
          <div id="edition-info"></div>
        </div>
        <button id="next" class="nav" title="Next edition (→)" aria-label="Next edition">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <div class="ticker-bar"><div id="ticker" class="ticker" aria-label="Market summary"></div></div>
  <div id="banner" class="banner" hidden></div>

  <div class="wrap">
    <section class="lead">
      <div class="lead-hod">
        <div class="kicker">HEADLINE OF THE DAY</div>
        <h1 id="hod"></h1>
      </div>
      <div class="lead-session" id="session" hidden></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="markets"><kbd>1</kbd>Markets<span class="count"></span></button>
      <button role="tab" data-tab="world"><kbd>2</kbd>World<span class="count"></span></button>
      <button role="tab" data-tab="energyTech"><kbd>3</kbd>Energy · AI · Tech<span class="count"></span></button>
    </nav>

    <main id="content"></main>
  </div>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span id="footer"></span>
      <span class="keys"><kbd>←</kbd> <kbd>→</kbd> editions · <kbd>1</kbd>–<kbd>3</kbd> tabs</span>
    </div>
  </footer>

  <nav class="bottombar" aria-label="Sections">
    <button data-tab="markets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Markets
    </button>
    <button data-tab="world">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>World
    </button>
    <button data-tab="energyTech">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Energy · Tech
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
